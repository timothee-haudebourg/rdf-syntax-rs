[package]
name = "rdf-syntax"
authors = ["Timothée Haudebourg <author@haudebourg.net>"]
description = "Lexical (syntactic) representation of RDF resources, built on top of rdf-types."
categories = ["data-structures"]
keywords = ["rdf", "w3c", "term", "literal"]
repository = "https://github.com/timothee-haudebourg/rdf-syntax-rs"
documentation = "https://docs.rs/rdf-syntax"
license = "MIT/Apache-2.0"
readme = "README.md"
edition = "2024"
rust-version = "1.89.0"
version = "1.0.0"

[features]
default = []
serde = ["dep:serde", "rdf-types/serde", "iref/serde", "langtag/serde"]
uuid-generator = ["uuid-generator-v3", "uuid-generator-v4", "uuid-generator-v5"]
uuid-generator-v3 = ["uuid", "uuid/v3"]
uuid-generator-v4 = ["uuid", "uuid/v4"]
uuid-generator-v5 = ["uuid", "uuid/v5"]

[dependencies]
rdf-types = "1.0"
iref = "5.0"
langtag = "1.1"
equivalent = "1.0.2"
into-owned-trait = "1.1"

# Minor
utf8-decode = "2.0.0"
str-newtype = "2.0.0"

# Optional
serde = { version = "1.0", features = ["derive"], optional = true }
uuid = { version = "0.8", optional = true }
